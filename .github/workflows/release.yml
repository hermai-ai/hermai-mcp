name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Align package version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"
      - name: Check whether npm version already exists
        id: npm_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "hermai-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm_version.outputs.exists == 'false'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          Dedicated Hermai MCP server for schema lookup, schema-request intake, and browser workflow classification.

          Install with:

          ```bash
          npx -y hermai-mcp
          ```

          MCP Registry server: `io.github.hermai-ai/hermai-mcp`
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "Hermai MCP ${VERSION}" \
            --notes-file release-notes.md
